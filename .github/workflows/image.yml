name: Docker Image CI

on:
  push:
    tags:
      - '*'

env:
  IMAGE: ghcr.io/odissei-data/dataverse-mapper

jobs:
  push:
    name: Push to registry.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_IMAGE=${{ env.IMAGE }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "Image: \`$IMAGE:$TAG@$DIGEST\`"
            echo
            git log --no-merges --format='%x01- %s (%h)%n%b' "${prev:+$prev..}$TAG" |
              awk '/^\001/ {print substr($0, 2); next} /^BREAKING[ -]CHANGE: / {print "  " $0}'
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
